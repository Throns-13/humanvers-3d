
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMANVERSE 3D</title>

  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      position: absolute;
      z-index: 2;
      top: 20px;
      left: 25px;
    }

    h1 {
      color: #ff3030;
      letter-spacing: 3px;
    }

    #graph {
      width: 100vw;
      height: 100vh;
    }

    #info {
      position: absolute;
      z-index: 2;
      right: 20px;
      bottom: 20px;
      width: 270px;
      padding: 18px;
      background: rgba(20, 10, 10, 0.92);
      border: 1px solid #9e2525;
      border-radius: 12px;
    }

    #info h2 { color: #ff4545; }
    #info p { line-height: 1.6; }
  </style>
</head>

<body>

<header>
  <h1>HUMANVERSE</h1>
  <p>3D KNOWLEDGE UNIVERSE</p>
</header>

<div id="graph"></div>

<div id="info">
  <h2 id="title">Knowledge Node</h2>
  <p id="description">
    คลิกจุดความรู้เพื่อดูรายละเอียด
  </p>
</div>

<script>

async function startGraph() {

  // โหลดฐานข้อมูลความรู้
  const response = await fetch("./data/knowledge.json");

  if (!response.ok) {
    throw new Error("ไม่สามารถโหลดฐานข้อมูลได้");
  }

  const data = await response.json();

  // สร้าง 3D Graph
  const Graph = ForceGraph3D()
    (document.getElementById("graph"))

    .graphData(data)
    .backgroundColor("#080808")
    .nodeLabel("name")
    .nodeAutoColorBy("group")
    .nodeVal(5)

    .linkColor(() => "#8e2929")
    .linkWidth(1.5)

    // คลิก Node เพื่ออ่านข้อมูล
    .onNodeClick(node => {

      document.getElementById("title")
        .textContent = node.name;

      document.getElementById("description")
        .textContent =
        node.details || node.description;

    });

  Graph.d3Force("charge").strength(-100);
}

// เริ่มต้นระบบ
startGraph().catch(error => {
  console.error(error);

  document.getElementById("title").textContent =
    "เกิดข้อผิดพลาด";

  document.getElementById("description").textContent =
    error.message;
});


</script>

</body>
</html>
